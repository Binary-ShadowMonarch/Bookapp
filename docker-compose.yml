services:
  # Nginx Reverse Proxy - The single entry point for your app
  nginx:
    image: nginx:1.27-alpine
    container_name: bookapp-proxy
    restart: always
    ports:
      # Maps host port 80 to nginx container port 80.
      # Change "80:80" to "8888:80" if port 80 is taken on your host.
      - "4353:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

  # SvelteKit Frontend Service
  frontend:
    build:
      context: ./frontend
    container_name: bookapp-frontend
    restart: always
    environment:
      # The Node adapter inside the container listens on port 3000
      - PORT=3000
      # Your SvelteKit app can use this to know where the API is
      - PUBLIC_API_URL=/api
      # - ORIGIN=https://books.saurab.com.np
      - ORIGIN=http://localhost:4353

    depends_on:
      - backend
    networks:
      - internal

  # Go Backend Service
  backend:
    build:
      context: ./backend
    container_name: bookapp-backend
    restart: always
    environment:
      # Use variables from the .env file
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - SEAWEEDFS_FILER_URL=${SEAWEEDFS_FILER_URL}
      - SEAWEEDFS_BASE_PATH=${SEAWEEDFS_BASE_PATH}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_EMAIL=${RESEND_EMAIL}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_started
    networks:
      - internal

  # PostgreSQL Database Service
  db:
    image: postgres:15
    container_name: bookapp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Mounts a named volume to the standard postgres data directory
      - pgdata:/var/lib/postgresql/
      # Mounts the init script to run on first launch
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # SeaweedFS Storage Services
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: bookapp-seaweedfs-master
    restart: always
    command: master -ip=seaweedfs-master -port=9333
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - internal

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: bookapp-seaweedfs-volume
    restart: always
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -ip=seaweedfs-volume -dir=/data
    depends_on:
      - seaweedfs-master
    volumes:
      - seaweedfs_volume_data:/data
    networks:
      - internal

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: bookapp-seaweedfs-filer
    restart: always
    command: filer -master=seaweedfs-master:9333 -port=8888 -ip=seaweedfs-filer -dir=/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    volumes:
      - seaweedfs_filer_data:/data
    networks:
      - internal

  # Database Backup Service
  db-backup:
    image: postgres:15
    container_name: bookapp-db-backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db # Service name of the database
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        mkdir -p /backups &&
        while true; do
          ts=$$(date +%F_%H%M);
          pg_dump -h db -U $${PGUSER} $${PGDATABASE} > /backups/bookapp_backup_$${ts}.sql &&
          echo \"[+] backup $${ts} done\" &&
          find /backups -type f -mtime +7 -name '*.sql' -delete &&
          sleep 24h;
        done
      "
    networks:
      - internal

volumes:
  pgdata:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:

networks:
  internal:
    driver: bridge
