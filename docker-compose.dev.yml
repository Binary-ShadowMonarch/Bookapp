services:
  # Nginx Reverse Proxy - The single entry point for your app
  nginx:
    image: nginx:1.27-alpine
    container_name: bookapp-proxy-dev
    restart: always
    ports:
      # Maps host port 80 to nginx container port 80.
      # Change "80:80" to "8888:80" if port 80 is taken on your host.
      - "4353:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

  # SvelteKit Frontend Service - Development Mode
  frontend:
    image: node:20-alpine
    container_name: bookapp-frontend-dev
    restart: always
    working_dir: /app
    environment:
      # The Node adapter inside the container listens on port 3000
      - PORT=3000
      # SvelteKit app can use this to know where the API is
      - PUBLIC_API_URL=/api
      # - ORIGIN=https://books.saurabp.com.np
      - ORIGIN=http://localhost:4353
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm i -g pnpm && pnpm install && pnpm dev --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    networks:
      - internal

  # Go Backend Service - Development Mode
  backend:
    image: golang:1.24.5-bookworm
    container_name: bookapp-backend-dev
    restart: always
    working_dir: /app
    env_file:
      - .env.local
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    command: sh -c "go mod download && go run ./cmd/server/main.go"
    depends_on:
      db:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_started
    networks:
      - internal

  # PostgreSQL Database Service
  db:
    image: postgres:15
    container_name: bookapp-db-dev
    restart: always
    env_file:
      - .env.local
    volumes:
      # Mounts a named volume to the standard postgres data directory
      - pgdata:/var/lib/postgresql/data
      # Mounts the init script to run on first launch
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # SeaweedFS Storage Services
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: bookapp-seaweedfs-master-dev
    restart: always
    command: master -ip=seaweedfs-master -port=9333
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - internal

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: bookapp-seaweedfs-volume-dev
    restart: always
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -ip=seaweedfs-volume -dir=/data
    depends_on:
      - seaweedfs-master
    volumes:
      - seaweedfs_volume_data:/data
    networks:
      - internal

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: bookapp-seaweedfs-filer-dev
    restart: always
    command: filer -master=seaweedfs-master:9333 -port=8888 -ip=seaweedfs-filer -dir=/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    volumes:
      - seaweedfs_filer_data:/data
    networks:
      - internal

  # Database Backup Service
  db-backup:
    image: postgres:15
    container_name: bookapp-db-backup-dev
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        mkdir -p /backups &&
        while true; do
          ts=$$(date +%F_%H%M);
          pg_dump -h db -U $${PGUSER} $${PGDATABASE} > /backups/bookapp_backup_$${ts}.sql &&
          echo \"[+] backup $${ts} done\" &&
          find /backups -type f -mtime +7 -name '*.sql' -delete &&
          sleep 24h;
        done
      "
    networks:
      - internal

volumes:
  pgdata:
  go-mod-cache:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:


networks:
  internal:
    driver: bridge
